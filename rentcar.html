<!DOCTYPE html>
<html lang="az">
<head>
    <link rel="icon" type="image/png" href="assets/favicon.png?v=3">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İcarə şirkəti — CarAll</title>
  <meta name="description" content="Avtomobil icarəsi şirkətinin maşın parkı və əlaqə məlumatları. CarAll Rent a Car." />
  <link rel="canonical" href="https://carall.az/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="İcarə şirkəti — CarAll" />
  <meta property="og:description" content="Avtomobil icarəsi şirkətinin maşın parkı və əlaqə məlumatları. CarAll Rent a Car." />
  <meta property="og:image" content="https://carall.az/images/Logo.png" />
  <meta property="og:url" content="https://carall.az/" />

  <!-- əsas style -->
  <link rel="stylesheet" href="css/style.css?v=46" />
  <!-- SALON CSS istifadə edirik -->
  <link rel="stylesheet" href="css/salon.css?v=46" />
</head>

<!-- Mobile Bottom Nav -->
<nav class="bnav" id="bnav">
  <a class="bnav__item is-active" href="#top">
    <span class="bnav__text">Əsas səhifə</span>
  </a>
  <a class="bnav__item" href="#list">
    <span class="bnav__text">Axtar</span>
  </a>
  <a class="bnav__fab" href="addproduct.html">
    <span class="bnav__plus">+</span>
  </a>
  <a class="bnav__item" href="favorites.html">
    <span class="bnav__text">Seçilmişlər</span>
  </a>
  <a class="bnav__item" href="#">
    <span class="bnav__text">Hesab</span>
  </a>
</nav>

<body class="auth-body">

  <!-- HEADER -->
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">
        <img src="assets/Logo.png?v=2" class="brand__img">
      </a>

      <nav class="nav">
        <a class="nav__link nav__link--fav" href="favorites.html">
          ❤ Seçilmişlər
        </a>
        <a class="nav__link" href="#">Elanlar</a>
        <a class="nav__link" href="#">Əlaqə</a>
        <a class="nav__btn" href="addproduct.html">+ Elan yerləşdir</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main class="wrap">

    <!-- HERO -->
    <section class="salon-hero" id="rentHero"></section>

    <!-- ELANLAR -->
    <section class="salon-block">

      <div class="salon-block__head">
        <h2 class="salon-block__title">Bu rent profilinin elanları</h2>
        <span id="rentCarsCount" class="salon-pill">—</span>
      </div>

      <!-- SEARCH -->
      <div class="salon-tools">
        <div class="salon-search">
          <input id="rentSearch" type="search" placeholder="Model, marka yaz…">
          <button id="rentClear" hidden>✕</button>
        </div>
      </div>

      <!-- GRID -->
      <div id="rentCarsGrid" class="grid"></div>

      <!-- SCROLL -->
      <div id="pagerSentinel" class="salon-sentinel">
        <span id="sentinelText">Yüklənir…</span>
      </div>

      <!-- EMPTY -->
      <div id="rentCarsEmpty" class="salon-empty" hidden>
        <div class="salon-empty__t">Elan yoxdur</div>
        <div class="salon-empty__d">Bu profil hələ elan yerləşdirməyib.</div>
      </div>

    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      © 2026 CarAll
    </div>
  </footer>

  <!-- JS -->
  <script src="js/carsdata.js?v=46"></script>
  <script src="js/script.js?v=46"></script>
  <script src="js/rentcar.js?v=46"></script>

<script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('carall_session_v1') || '{}');
    var userLink = document.getElementById('headerUser');
    var bnavProfile = document.querySelector('.bnav__item[href="profile.html"]');
    if(s.loggedIn){
      if(userLink){ userLink.href = 'profile.html'; userLink.setAttribute('aria-label','Profil'); }
      if(bnavProfile){ bnavProfile.href = 'profile.html'; }
    }
  } catch(e){}
})();
</script>
</body>
</html>
