<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elan Detalı — Admin</title>
  <link rel="stylesheet" href="./css/admin.css?v=36">
  <style>
    body { background:#f1f5f9; }
    .ld-wrap { max-width:960px; margin:24px auto; padding:0 16px; }
    .ld-back { display:inline-flex;align-items:center;gap:6px;color:#1B3A6B;text-decoration:none;font-weight:600;margin-bottom:16px;font-size:15px; }
    .ld-back:hover { text-decoration:underline; }

    /* Gallery */
    .ld-gallery-wrap { background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:16px; }
    .ld-main-img-wrap { position:relative;background:#f8fafc; }
    .ld-main-img { width:100%;max-height:460px;object-fit:cover;display:block; }
    .ld-nav { position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center; }
    .ld-nav-l { left:12px; }
    .ld-nav-r { right:12px; }
    .ld-count { position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.5);color:#fff;font-size:13px;padding:2px 10px;border-radius:20px; }
    .ld-thumbs { display:flex;gap:8px;padding:12px;overflow-x:auto; }
    .ld-thumbs img { height:72px;width:108px;object-fit:cover;border-radius:6px;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:.15s; }
    .ld-thumbs img.active { border-color:#1B3A6B; }

    /* Info */
    .ld-info { background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:24px;margin-bottom:16px; }
    .ld-head { display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px; }
    .ld-title { font-size:22px;font-weight:800;margin:0; }
    .ld-sub { color:#64748b;margin:0 0 16px;font-size:14px; }
    .ld-price { font-size:28px;font-weight:800;color:#1B3A6B;margin-bottom:20px; }
    .ld-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:20px; }
    .ld-field { background:#f8fafc;border-radius:8px;padding:10px 14px; }
    .ld-field__label { font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px; }
    .ld-field__val { font-weight:600;font-size:14px; }
    .ld-desc { background:#f8fafc;border-radius:8px;padding:14px;line-height:1.6;font-size:14px;margin-bottom:0; }

    /* Status badge */
    .ld-badge { display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600; }
    .ld-badge.s1 { background:#fef3c7;color:#d97706; }
    .ld-badge.s2 { background:#dcfce7;color:#16a34a; }
    .ld-badge.s3 { background:#fee2e2;color:#dc2626; }

    /* Actions */
    .ld-actions { background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:20px;display:flex;gap:12px; }
    .ld-btn-approve { flex:1;padding:13px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer; }
    .ld-btn-approve:hover { background:#15803d; }
    .ld-btn-reject  { flex:1;padding:13px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer; }
    .ld-btn-reject:hover { background:#b91c1c; }
    .ld-btn-approve:disabled,.ld-btn-reject:disabled { opacity:.5;cursor:not-allowed; }
    .ld-msg { padding:10px 20px;font-weight:600;border-radius:8px;display:none;margin-top:10px; }
    .ld-msg.ok  { background:#dcfce7;color:#16a34a; }
    .ld-msg.err { background:#fee2e2;color:#dc2626; }

    .ld-loading { text-align:center;padding:80px;color:#64748b;font-size:16px; }
  </style>
</head>
<body>
  <div class="ld-wrap">
    <a class="ld-back" href="dashboard.html">← Geri</a>

    <div id="ldLoading" class="ld-loading">Yüklənir...</div>

    <div id="ldContent" style="display:none">

      <!-- Gallery -->
      <div class="ld-gallery-wrap">
        <div class="ld-main-img-wrap">
          <img id="ldMainImg" class="ld-main-img" src="" alt="Avtomobil">
          <button class="ld-nav ld-nav-l" id="ldPrev">&#8249;</button>
          <button class="ld-nav ld-nav-r" id="ldNext">&#8250;</button>
          <div class="ld-count" id="ldCount">1 / 1</div>
        </div>
        <div class="ld-thumbs" id="ldThumbs"></div>
      </div>

      <!-- Info -->
      <div class="ld-info">
        <div class="ld-head">
          <div>
            <h1 class="ld-title" id="ldTitle"></h1>
            <p class="ld-sub" id="ldSub"></p>
          </div>
          <span class="ld-badge" id="ldBadge"></span>
        </div>
        <div class="ld-price" id="ldPrice"></div>
        <div class="ld-grid" id="ldGrid"></div>
        <div class="ld-desc" id="ldDesc" style="display:none"></div>
      </div>

      <!-- Actions -->
      <div class="ld-actions">
        <button class="ld-btn-approve" id="ldApprove">✅ Təsdiqlə</button>
        <button class="ld-btn-reject"  id="ldReject">❌ İmtina et</button>
      </div>
      <div class="ld-msg" id="ldMsg"></div>

    </div>
  </div>

<script>
(async () => {
  const API   = 'https://carall.az/api';
  const TOKEN = localStorage.getItem('access_token') || '';
  const id    = new URLSearchParams(location.search).get('id');

  const $ = s => document.getElementById(s);

  if (!id) { $('ldLoading').textContent = 'ID tapılmadı'; return; }

  // ── Helper: şəkil URL-i al ──
  function imgUrl(img) {
    if (!img) return '';
    if (typeof img === 'string') return img;
    return img.original || img.Original ||
           img.large    || img.Large    ||
           img.small    || img.Small    ||
           img.url      || img.imageUrl || '';
  }

  // ── Elanı çək ──
  let car = null;
  let moderationStatus = null; // Ayrıca: admin təsdiq statusu (1/2/3)

  // 0. Əvvəlcə lokal yaddaşda saxlanmış statusu yoxla (bu brauzerdə əvvəl
  //    təsdiqlənib/rədd edilibsə, backend-in cavabından asılı olmadan bunu istifadə et)
  const LOCAL_KEY = 'carall_admin_status_' + id;
  const localOverride = localStorage.getItem(LOCAL_KEY);
  if (localOverride) {
    moderationStatus = Number(localOverride);
  }

  // 1. Əvvəlcə pending siyahısından axtar (full_filter yalnız aktiv/təsdiqlənmiş elanları qaytarır)
  try {
    const rp = await fetch(`${API}/admin/listings/pending?page=1&pageSize=200`, {
      headers: TOKEN ? { 'Authorization': `Bearer ${TOKEN}` } : {}
    });
    if (rp.ok) {
      const data = await rp.json();
      const list = Array.isArray(data) ? data : (data.data || data.items || []);
      const found = list.find(x => String(x.listingId || x.id) === String(id));
      if (found) {
        if (!localOverride) moderationStatus = found.status ?? 1; // pending siyahısındadırsa, status=1 say
        car = found;
      }
    }
  } catch(e) { /* ignore */ }

  // 2. full_filter-dən də axtar (təsdiqlənmiş/rədd edilmiş elanlar üçün)
  if (moderationStatus === null) {
    try {
      const rl = await fetch(`${API}/Listings/full_filter`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page:1, pageSize:200, includeTotalCount:false })
      });
      if (rl.ok) {
        const data = await rl.json();
        const list = Array.isArray(data) ? data : (data.data || data.items || []);
        const found = list.find(x => String(x.id) === String(id));
        if (found) {
          moderationStatus = found.status;
          car = found;
        }
      }
    } catch(e) { /* ignore */ }
  }

  // 3. Tam detalı (şəkillər üçün) çək — bu endpoint-in "status" sahəsi
  // avtomobilin vəziyyətini (used/new) bildirir, moderasiya statusunu YOX
  try {
    const r1 = await fetch(`${API}/Listings/${id}`, {
      headers: TOKEN ? { 'Authorization': `Bearer ${TOKEN}` } : {}
    });
    if (r1.ok) {
      const detail = await r1.json();
      car = { ...detail, vehicleCondition: detail.status };
    }
  } catch(e) { /* ignore, car may already be set from list */ }

  if (!car) {
    $('ldLoading').textContent = 'Elan tapılmadı';
    return;
  }

  // Moderasiya statusunu ayrıca sahəyə yaz (car.status ilə qarışmasın)
  car.moderationStatus = moderationStatus;

  $('ldLoading').style.display = 'none';
  $('ldContent').style.display = '';

  // ── Şəkillər ──
  const rawImgs = Array.isArray(car.images) ? car.images : [];
  let imgs = rawImgs.map(imgUrl).filter(Boolean);

  // admin.js kimi əlavə fallback-lar (mainImage, imageUrl, image)
  if (!imgs.length) {
    const fallback = car.mainImage || car.imageUrl || car.image;
    if (fallback) imgs = [fallback];
  }

  let cur = 0;
  const mainImg  = $('ldMainImg');
  const countEl  = $('ldCount');
  const thumbsEl = $('ldThumbs');

  function showImg(i) {
    if (!imgs.length) {
      mainImg.removeAttribute('src');
      mainImg.style.background = '#e5e7eb';
      mainImg.alt = 'Şəkil yoxdur';
      countEl.textContent = '0 / 0';
      return;
    }
    cur = Math.max(0, Math.min(imgs.length - 1, i));
    mainImg.src = imgs[cur];
    mainImg.onerror = () => {
      mainImg.onerror = null;
      mainImg.style.background = '#e5e7eb';
      mainImg.alt = 'Şəkil yoxdur';
      mainImg.removeAttribute('src');
    };
    countEl.textContent = `${cur + 1} / ${imgs.length}`;
    thumbsEl.querySelectorAll('img').forEach((t, j) => t.classList.toggle('active', j === cur));
  }

  // Thumbnails
  imgs.forEach((url, i) => {
    const t = document.createElement('img');
    t.src = url;
    t.onerror = () => {
      t.onerror = null;
      t.style.background = '#e5e7eb';
      t.removeAttribute('src');
    };
    if (i === 0) t.classList.add('active');
    t.addEventListener('click', () => showImg(i));
    thumbsEl.appendChild(t);
  });

  if (imgs.length <= 1) thumbsEl.style.display = 'none';

  showImg(0);
  $('ldPrev').addEventListener('click', () => showImg(cur - 1));
  $('ldNext').addEventListener('click', () => showImg(cur + 1));

  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  showImg(cur - 1);
    if (e.key === 'ArrowRight') showImg(cur + 1);
  });

  // ── Info ──
  const brand = car.brand || car.makeName || '';
  const model = car.model || car.modelName || '';
  $('ldTitle').textContent = [brand, model].filter(Boolean).join(' ') || 'Avtomobil';
  $('ldSub').textContent   = [car.modelYear || car.year, car.city].filter(Boolean).join(' • ');
  $('ldPrice').textContent = car.price
    ? `${Number(car.price).toLocaleString('az-AZ')} ${car.valuta || 'AZN'}`
    : '—';

  // Status badge
  const badge = $('ldBadge');
  function parseStatus(s) {
    if (s === undefined || s === null) return 1;
    if (typeof s === 'number') return s;
    if (typeof s === 'string' && /^\d+$/.test(s.trim())) return Number(s);
    const t = String(s).trim().toLowerCase();
    if (['pending', 'gözləyir', 'gozleyir', 'waiting'].includes(t)) return 1;
    if (['approved', 'active', 'təsdiqlənmiş', 'tesdiqlenmis'].includes(t)) return 2;
    if (['rejected', 'reddedilmis', 'rədd edilmiş', 'declined'].includes(t)) return 3;
    return 1;
  }
  const st = parseStatus(car.moderationStatus);
  const stMap   = { 1:'Gözləyir', 2:'Təsdiqlənmiş', 3:'Rədd edilmiş' };
  const stClass = { 1:'s1',       2:'s2',           3:'s3' };
  badge.textContent = stMap[st] || 'Naməlum';
  badge.className   = 'ld-badge ' + (stClass[st] || '');

  // Fields
  const fields = [
    ['Marka',        brand],
    ['Model',        model],
    ['İl',           car.modelYear || car.year],
    ['Şəhər',        car.city],
    ['Yanacaq',      car.fuelType || car.fuelTypeName],
    ['Transmissiya', car.transmission || car.transmissionName],
    ['Rəng',         car.color || car.colorName],
    ['Motor',        car.engineVolume],
    ['Yürüş',        car.odometerReading ? car.odometerReading.toLocaleString('az-AZ') + ' km' : null],
    ['Qapı',         car.door],
    ['Nəqliyyat növü', car.vehicleType || car.vehicleTypeName],
    ['Satıcı',       car.user?.name],
    ['Telefon',      car.user?.phoneNumber],
    ['Kredit',       car.isCredit ? 'Var' : null],
    ['Barter',       car.isBarter ? 'Var' : null],
    ['VIN',          car.vin],
  ].filter(([, v]) => v !== null && v !== undefined && v !== '' && v !== '—');

  $('ldGrid').innerHTML = fields.map(([label, val]) => `
    <div class="ld-field">
      <div class="ld-field__label">${label}</div>
      <div class="ld-field__val">${val}</div>
    </div>`).join('');

  if (car.description) {
    const desc = $('ldDesc');
    desc.style.display = '';
    desc.textContent   = car.description;
  }

  // ── Əməliyyatlar ──
  const btnApprove = $('ldApprove');
  const btnReject  = $('ldReject');
  const msgEl      = $('ldMsg');
  const actionsBox = document.querySelector('.ld-actions');

  // Artıq təsdiqlənib/rədd edilibsə, düymələri göstərmə
  if (st !== 1) {
    if (actionsBox) actionsBox.style.display = 'none';
  }

  function showMsg(text, ok) {
    msgEl.textContent = text;
    msgEl.className   = 'ld-msg ' + (ok ? 'ok' : 'err');
    msgEl.style.display = '';
  }

  async function setStatus(status) {
    btnApprove.disabled = true;
    btnReject.disabled  = true;
    try {
      const res = await fetch(`${API}/Listings/${id}/status`, {
        method:  'PATCH',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${TOKEN}`
        },
        body: JSON.stringify(status)
      });
      if (res.ok) {
        const label = status === 2 ? 'Təsdiqlənmiş' : 'Rədd edilmiş';
        localStorage.setItem(LOCAL_KEY, String(status));
        alert(status === 2 ? '✅ Elan uğurla təsdiqləndi!' : '❌ Elan rədd edildi.');
        showMsg(`✅ Elan ${label}!`, status === 2);
        badge.textContent = stMap[status] || label;
        badge.className   = 'ld-badge ' + (stClass[status] || '');
        btnApprove.style.display = 'none';
        btnReject.style.display  = 'none';
      } else {
        const txt = await res.text().catch(() => '');
        alert('Xəta: ' + (txt || res.status));
        showMsg('Xəta: ' + (txt || res.status), false);
        btnApprove.disabled = false;
        btnReject.disabled  = false;
      }
    } catch(e) {
      showMsg('Bağlantı xətası', false);
      btnApprove.disabled = false;
      btnReject.disabled  = false;
    }
  }

  btnApprove.addEventListener('click', () => setStatus(2));
  btnReject.addEventListener('click',  () => setStatus(3));

})();
</script>
</body>
</html>
